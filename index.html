<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pabal Ahmed | Systems Engineering & Security</title>
    <meta name="description" content="Pabal Ahmed. IT student at NJIT. Linux, networking and security projects.">
    <link rel="stylesheet" href="style.css">
    <script src="boot.js"></script>
</head>
<body>
    <div id="loader" role="status" aria-live="polite">
        <span class="shine">Connecting…</span>
    </div>

    <div class="bg" id="bg"></div>

    <main class="stage" id="stage">
        <svg id="links" aria-hidden="true"></svg>

        <!-- Swap src to your real file name -->
        <img class="face" id="face" src="assets/face.png" alt="Portrait of Pabal Ahmed, half photo and half painting">

        <h1 class="face-name" id="name">Pabal Ahmed</h1>

        <!--
          data-x / data-y : spot on stage (0-100 wide, 0-56 tall)
          data-depth      : how far it drifts with the mouse (bigger = more)
          data-parent     : who it links to ("face" or another node id)
          data-link       : cable look: copper | fiber | serial | console | dotted
          PLACEHOLDER LINKS: replace each href="#"
        -->
        <div class="node"      id="about"    data-x="22" data-y="9"  data-depth="2.2" data-parent="face" data-link="copper">
            <a class="glass" href="#">about me</a>
        </div>
        <div class="node"      id="resume"   data-x="11" data-y="28" data-depth="3.0" data-parent="face" data-link="copper">
            <a class="glass" href="#">resume</a>
        </div>
        <div class="node"      id="docs"     data-x="78" data-y="8"  data-depth="2.6" data-parent="face" data-link="fiber">
            <a class="glass" href="#">project Docs<small>gitbook</small></a>
        </div>

        <!-- Hub: Socials -> end devices -->
        <div class="node hub"  id="socials"  data-x="86" data-y="28" data-depth="3.2" data-parent="face" data-link="serial">
            <a class="glass" href="#">socials</a>
        </div>
        <div class="node leaf" id="linkedin" data-x="92" data-y="46" data-depth="4.2" data-parent="socials" data-link="console">
            <a class="glass" href="https://linkedin.com/in/pabal">linkedin</a>
        </div>
        <div class="node leaf" id="github"   data-x="75" data-y="48" data-depth="4.0" data-parent="socials" data-link="console">
            <a class="glass" href="https://github.com/pabal95">github</a>
        </div>

        <!-- Hub: Projects -> end devices -->
        <div class="node hub"  id="projects" data-x="30" data-y="45" data-depth="3.0" data-parent="face" data-link="copper">
            <a class="glass" href="#">projects</a>
        </div>
        <div class="node leaf" id="laptops"  data-x="13" data-y="50" data-depth="4.2" data-parent="projects" data-link="console">
            <a class="glass" href="https://laptops.pabal.dev">laptop inventory<small>=php / =mysql</small></a>
        </div>
        <div class="node leaf" id="homelab"  data-x="39" data-y="52" data-depth="4.0" data-parent="projects" data-link="dotted">
            <a class="glass" href="#">homelab<small>placeholder</small></a>
        </div>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
